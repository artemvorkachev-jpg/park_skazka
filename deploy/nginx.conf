# Сайт «Хранитель Сказки»: лендинг, игра, погода, сайт защиты и чат Баюна.
# Подключается в docker-compose.yml вместо default.conf.

server {
    listen 80;
    server_name _;

    # Лендинг кейса
    root /var/www/site;
    index index.html;

    # Чат Баюна: страница UI и SSE-API.
    # proxy_pass с завершающим «/» срезает префикс /bayun/,
    # поэтому относительный fetch('api/chat') из UI попадает в /api/chat бэкенда.
    location /bayun/ {
        proxy_pass http://bayun:8130/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: без буферизации, иначе ответы Баюна дойдут только в конце
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Игра-прототип (статические файлы; без ключа ведёт резервный ведущий)
    location /game/ {
        alias /var/www/game/;
        index index.html;
    }

    # Виджет погоды (Open-Meteo)
    location /weather/ {
        alias /var/www/weather/;
        index index.html;
    }

    # Сайт защиты — пакет для жюри
    location /defense/ {
        alias /var/www/defense/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
