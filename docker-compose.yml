# Бэкенд чата Баюна (сайт обслуживает ваш nginx, статику поднимаете сами).
#
# Запуск (в корне репозитория):
#   cp runner/.env .env        # ключ QWEN_API_KEY (если .env ещё нет)
#   docker compose up -d --build
#
# Контейнер подключается к внешней сети ai-net (nginx-контейнер ходит на чат
# по имени — proxy_pass http://bayun:8130/) и одновременно публикует порт
# на хосте: 127.0.0.1:8130 (для хостового nginx — proxy_pass http://127.0.0.1:8130/).

services:
  bayun:
    build: ./runner
    image: park-skazka-bayun
    restart: unless-stopped
    environment:
      # compose читает .env рядом с этим файлом; без ключа контейнер не стартует
      QWEN_API_KEY: "${QWEN_API_KEY:?Создайте .env рядом с docker-compose.yml (cp runner/.env .env)}"
      CHAT_PORT: 8130
    ports:
      - "127.0.0.1:8130:8130"   # для хостового nginx; наружу порт не открыт
    networks:
      - ai-net
    volumes:
      # состояние агента (auth.json, models.resolved.json) — переживает пересборку
      - bayun_agent:/app/agent
      # заявки визитов и вопросы гостей (данные маркетингового дашборда)
      - bayun_data:/app/chat/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8130/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bayun_agent:
  bayun_data:

networks:
  ai-net:
    external: true

