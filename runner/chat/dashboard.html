<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд маркетинга — «Хранитель Сказки»</title>
<meta name="description" content="Что планируют гости парка «Сказка»: категории групп, топ аттракционов, даты визитов и вопросы Баюну.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=PT+Root+UI:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Дизайн-система — см. DESIGN.md (стиль parkskazka.com) */
:root{
  --blue:#34B4E8; --accent:#D32D6B; --green:#00B453; --lime:#D2F366; --lilac:#CCB5FB;
  --ink:#222222; --muted:#5A6572; --light:#E6F6FE;
  --shadow-sm:0 2px 8px rgba(35,40,47,.10); --shadow:0 8px 24px rgba(35,40,47,.15);
  --disp:'Oswald','Bebas Neue','Arial Narrow',Impact,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'PT Root UI','Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#E6F6FE 0%,#F4FBFF 60%,#fff 240px);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
h1,h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0}
h2{font-size:20px;margin-bottom:14px}

header{background:var(--blue);color:#fff;box-shadow:var(--shadow-sm)}
.hbar{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ava{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;font-size:22px;flex:none;box-shadow:var(--shadow-sm)}
.hbar h1{font-size:24px}
.hbar h1 small{display:block;font:500 11px/1.4 'PT Root UI',sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.hbar .actions{margin-left:auto;display:flex;gap:9px;align-items:center}
.hbar .actions .note{font-size:12.5px;opacity:.9}
.btn{border:0;border-radius:100px;padding:10px 22px;font:700 13px/1 'PT Root UI',sans-serif;letter-spacing:.02em;text-transform:uppercase;color:#fff;background:var(--accent);transition:.25s}
.btn:hover{filter:brightness(.92);transform:translateY(-1px)}

main{max-width:1180px;margin:0 auto;padding:26px 20px 40px}
#err{display:none;background:#FFE9E5;border:1px solid #FFC7BD;color:#8E1B00;border-radius:18px;padding:12px 20px;margin:0 0 18px;font-size:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border-radius:24px;box-shadow:var(--shadow-sm);padding:20px 24px}
.kpi b{display:block;font:600 42px/1 var(--disp)}
.kpi span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:28px;box-shadow:var(--shadow-sm);padding:24px 26px;margin-bottom:14px}
.card.wide{grid-column:1 / -1}
.grid .card{margin-bottom:0}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:150px 1fr 74px;gap:10px;align-items:center;font-size:13.5px}
.bar-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .num{font-weight:700;text-align:right;white-space:nowrap}
.bar{height:16px;border-radius:100px;background:#EEF4F8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:100px;background:var(--blue);transition:width .5s ease}
.bar.c-family i{background:var(--blue)} .bar.c-adults i{background:var(--green)} .bar.c-kids i{background:var(--lilac)}
.bar.c-seg i{background:var(--sky)}
.bar.c-top i{background:var(--accent)}
.bar.c-date i{background:var(--blue)}
@media(max-width:560px){.bar-row{grid-template-columns:104px 1fr 60px;font-size:12.5px}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:700 11.5px/1.3 'PT Root UI',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1.5px solid #E4EDF3}
td{padding:9px 10px;border-bottom:1px solid #F0F5F9;vertical-align:top}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:100px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.family{background:var(--light);color:#15648C}
.pill.adults{background:#E2F7EC;color:#007A41}
.pill.kids{background:#F1E9FF;color:#6A3FA8}
.muted{color:var(--muted)}

.feed{display:flex;flex-direction:column;gap:8px}
.q{background:#F7FBFE;border-radius:16px;padding:9px 16px;font-size:13.5px}
.q small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.q.ans{background:#FFF7F9}

.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14.5px}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="ava">📊</div>
    <h1>Дашборд маркетинга<small>«Хранитель Сказки» · парк «Сказка»</small></h1>
    <div class="actions">
      <span class="note" id="genAt"></span>
      <button class="btn" id="refresh" type="button">↻ Обновить</button>
    </div>
  </div>
</header>

<main>
  <div id="err"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="card"><h2>Категории групп</h2><div class="bars" id="categories"></div></div>
    <div class="card"><h2>Состав группы</h2><div class="bars" id="sizes"></div></div>
    <div class="card"><h2>Топ аттракционов</h2><div class="bars" id="top"></div></div>
    <div class="card"><h2>Гости по росту</h2><div class="bars" id="segments"></div></div>
    <div class="card"><h2>Даты визитов</h2><div class="bars" id="dates"></div></div>
    <div class="card"><h2>Дни недели</h2><div class="bars" id="weekdays"></div></div>
    <div class="card wide"><h2>Последние заявки</h2><div id="visits"></div></div>
    <div class="card wide"><h2>Диалог с Баюном</h2><div class="feed" id="questions"></div></div>
  </div>
</main>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATEGORY_RU = { family:'Семья с детьми', adults:'Взрослая компания', kids:'Детская группа' };
const SEGMENT_RU = { kid:'Малыши (до 120 см)', child:'Дети (120–149 см)', adult:'Взрослые (от 150 см)' };
const TOKEN_KEY = 'bayun.dash.token';

function getToken(){
  let t = localStorage.getItem(TOKEN_KEY) || '';
  if (!t) { t = prompt('Токен дашборда (переменная DASHBOARD_TOKEN):', '') || ''; if (t) localStorage.setItem(TOKEN_KEY, t); }
  return t;
}
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

function bars(el, rows, cls){
  const max = Math.max(1, ...rows.map(r => r.count));
  const clsOf = typeof cls === 'function' ? (r, i) => cls(r, i) : () => cls || '';
  el.innerHTML = rows.length ? rows.map((r, i) => `
    <div class="bar-row">
      <span class="lbl" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="bar ${clsOf(r, i)}"><i style="width:${Math.round(r.count / max * 100)}%"></i></span>
      <span class="num">${r.count}${r.suffix || ''}</span>
    </div>`).join('') : '<div class="empty">Пока нет данных</div>';
}
const pct = (n, total) => total ? ` (${Math.round(n / total * 100)}%)` : '';

function kpi(value, label){
  return `<div class="kpi"><b>${esc(value)}</b><span>${esc(label)}</span></div>`;
}
function fmtTs(iso){
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
const shortDate = iso => (iso || '').replace(/^\d{4}-/, '').replace('-', '.');

function render(s){
  $('#genAt').textContent = 'на ' + new Date(s.generatedAt).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  $('#kpis').innerHTML =
    kpi(s.visitsCount, 'спланировано визитов') +
    kpi(s.guestsTotal, 'гостей всего') +
    kpi(s.avgGroupSize, 'средний размер группы') +
    kpi(s.familyShare + '%', 'доля «Семья с детьми»') +
    kpi(s.routesBuilt, `маршрутов построено${s.avgStops ? ` · ~${s.avgStops} точек` : ''}`);

  const C = s.categories || {};
  const catKeys = Object.keys(CATEGORY_RU);
  bars($('#categories'), catKeys.map(k => ({
    label: CATEGORY_RU[k], count: C[k] || 0, suffix: pct(C[k] || 0, s.visitsCount),
  })), (r, i) => 'c-' + catKeys[i]);

  const sizes = s.sizes || {};
  const sizeKeys = Object.keys(sizes).sort((a, b) => (parseInt(a) || 5) - (parseInt(b) || 5));
  bars($('#sizes'), sizeKeys.map(k => ({
    label: k === '1' ? '1 гость' : k === '5+' ? '5 и больше' : k + ' гостя',
    count: sizes[k], suffix: pct(sizes[k], s.visitsCount),
  })));

  bars($('#top'), (s.topAttractions || []).map(a => ({ label: a.name, count: a.count })), 'c-top');

  const S = s.segments || {};
  bars($('#segments'), Object.entries(SEGMENT_RU).map(([k, label]) => ({ label, count: S[k] || 0 })), 'c-seg');

  bars($('#dates'), (s.dates || []).map(([d, n]) => ({ label: shortDate(d), count: n })), 'c-date');
  bars($('#weekdays'), (s.weekdays || []).map(w => ({ label: w.name, count: w.count })), 'c-date');

  $('#visits').innerHTML = (s.recentVisits || []).length ? `
    <table>
      <thead><tr><th>Отправлена</th><th>Дата визита</th><th>Состав</th><th>Категория</th><th>Маршрут</th><th>Реплик</th></tr></thead>
      <tbody>${s.recentVisits.map(v => `
        <tr>
          <td class="muted">${fmtTs(v.ts)}</td>
          <td>${v.date ? esc(shortDate(v.date)) + (v.time ? ' · ' + esc(v.time) : '') : '<span class="muted">—</span>'}</td>
          <td>${esc((v.group || []).map(g => `${g.name} (${g.height} см)`).join(', '))}</td>
          <td><span class="pill ${esc(v.category)}">${esc(CATEGORY_RU[v.category] || v.category || '—')}</span></td>
          <td class="muted">${v.route?.length ? esc(v.route.map(r => `${r.time} ${r.name}`).join(' · ')) : v.picks?.length ? esc(v.picks.join(', ')) : '—'}</td>
          <td><b>${v.questions || 0}</b></td>
        </tr>`).join('')}
      </tbody>
    </table>` : '<div class="empty">Заявок пока нет — спланируйте визит на главной странице Баюна</div>';

  $('#questions').innerHTML = (s.recentDialogue || []).length
    ? s.recentDialogue.map(d => d.role === 'bayun'
        ? `<div class="q ans"><small>🐈 ${fmtTs(d.ts)} · ответ Баюна${d.visitId ? ' · визит ' + esc(d.visitId.slice(0, 8)) : ''}</small>${esc(d.text.length > 220 ? d.text.slice(0, 220) + '…' : d.text)}</div>`
        : `<div class="q"><small>👤 ${fmtTs(d.ts)} · вопрос гостя${d.visitId ? ' · визит ' + esc(d.visitId.slice(0, 8)) : ''}</small>${esc(d.text)}</div>`).join('')
    : '<div class="empty">Реплик пока нет</div>';
}

async function load(){
  $('#err').style.display = 'none';
  try{
    const token = localStorage.getItem(TOKEN_KEY) || '';
    const res = await fetch('api/stats' + (token ? '?token=' + encodeURIComponent(token) : ''));
    if (res.status === 401){ clearToken(); throw new Error('Неверный токен — обновите страницу и введите заново'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
  } catch (e){
    const box = $('#err');
    box.textContent = 'Не удалось загрузить статистику: ' + e.message;
    box.style.display = 'block';
  }
}

$('#refresh').addEventListener('click', load);
load();
setInterval(load, 30000);
</script>
</body>
</html>
