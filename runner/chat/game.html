<style>
/* Дизайн-система — см. DESIGN.md (стиль parkskazka.com) */
:root{
  --blue:#34B4E8; --accent:#D32D6B; --red:#FF2400; --green:#00B453; --lime:#D2F366; --lilac:#CCB5FB;
  --ink:#222222; --muted:#5A6572; --light:#E6F6FE; --sky:#9CD6EE; --beige:#FDEBBF;
  --shadow-sm:0 2px 8px rgba(35,40,47,.10); --shadow:0 8px 24px rgba(35,40,47,.15);
  --disp:'Oswald','Bebas Neue','Arial Narrow',Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.5 'PT Root UI','Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#E6F6FE 0%,#F4FBFF 100%);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer}

/* ---------- шапка ---------- */
header{background:var(--blue);color:#fff;box-shadow:var(--shadow-sm);z-index:6}
.hbar{display:flex;align-items:center;gap:13px;padding:9px 16px}
.ava{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;font-size:22px;flex:none;box-shadow:var(--shadow-sm)}
.name{font:600 21px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.name small{display:block;font:500 10.5px/1.3 'PT Root UI',sans-serif;letter-spacing:.13em;text-transform:uppercase;opacity:.9;margin-top:2px}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:100px}
.status i{width:8px;height:8px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 0 3px rgba(124,255,178,.3)}
.status.off i{background:#FFD54D;box-shadow:0 0 0 3px rgba(255,213,77,.3)}
.hbar .btn{margin-left:auto}
@media(max-width:760px){.status{display:none}}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:100px;padding:10px 20px;font:700 12.5px/1 'PT Root UI',sans-serif;letter-spacing:.02em;text-transform:uppercase;color:#fff;text-decoration:none;transition:.25s}
.btn:hover{filter:brightness(.92);transform:translateY(-1px)}
.btn.blue{background:var(--blue);box-shadow:0 6px 18px rgba(52,180,232,.3)}
.btn.primary{background:var(--accent);box-shadow:0 6px 18px rgba(211,45,107,.3)}
.btn.small{padding:8px 15px;font-size:11.5px}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 16px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:100px;box-shadow:var(--shadow-sm);padding:7px 15px;font-size:13px;font-weight:500;white-space:nowrap}
.pill b{font-weight:700}
.hud .btns{margin-left:auto;display:flex;gap:6px}
.ibtn{width:36px;height:36px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:15px;font-weight:700;box-shadow:var(--shadow-sm);display:grid;place-items:center;transition:.2s}
.ibtn:hover{background:var(--light);transform:translateY(-1px)}
.ibtn.wide{width:auto;border-radius:100px;padding:0 14px;font-size:12px}
@media(max-width:640px){.hud .btns .ibtn:not(.wide){display:none}}
/* мобильный экран: шапка в одну строку, HUD — одна прокручиваемая строка,
   карточка квеста и тост компактнее, панель точек почти на всю ширину */
@media(max-width:640px){
  .hbar{padding:7px 12px;gap:9px}
  .ava{width:34px;height:34px;font-size:19px}
  .name{font-size:15px}
  .name small{display:none}
  .hbar .btn{padding:8px 11px;font-size:10.5px;white-space:nowrap;margin-left:auto}
  .hud{flex-wrap:nowrap;overflow-x:auto;padding:8px 10px 2px;gap:6px;scrollbar-width:none}
  .hud::-webkit-scrollbar{display:none}
  .pill{flex:none;padding:6px 12px;font-size:12px}
  .hud .btns{margin-left:auto;flex:none;gap:5px}
  main{margin:8px 10px 10px;border-radius:20px;min-height:300px}
  .qcard{left:8px;top:8px;max-width:calc(100% - 56px);padding:10px 14px;border-radius:18px}
  .qcard h3{font-size:14.5px}
  #toast{font-size:12.5px;max-width:92%;padding:9px 16px}
  #poiPanel{width:min(300px,calc(100% - 16px));right:8px;top:8px;bottom:8px}
}

/* ---------- сцена ---------- */
main{position:relative;flex:1;margin:10px 16px 14px;border-radius:32px;overflow:hidden;background:#8fc454;box-shadow:var(--shadow);min-height:340px}
#svgWrap{position:absolute;left:0;top:0;width:1470px;height:1080px;transform-origin:0 0;pointer-events:none}
#svgWrap svg{display:block;width:1470px;height:1080px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* карточка квеста */
.qcard{position:absolute;left:14px;top:14px;max-width:300px;background:rgba(255,255,255,.96);border-radius:22px;box-shadow:var(--shadow);padding:13px 18px;z-index:4}
.qcard h3{margin:0 0 3px;font:600 17px/1.2 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.qcard .sub{font-size:12.5px;color:var(--muted)}
.qcard .sub b{color:var(--accent)}
.qcard.done{outline:3px solid var(--lime)}
.qcard button{margin-top:8px}

/* панель «Точки парка» — интерактивная замена легенды карты */
#poiPanel{position:absolute;right:12px;top:12px;bottom:12px;width:288px;background:rgba(255,255,255,.97);border-radius:24px;box-shadow:var(--shadow);z-index:5;display:flex;flex-direction:column;overflow:hidden}
#poiPanel[hidden]{display:none}
#poiPanel .ph{padding:13px 18px 9px;border-bottom:1.5px solid #EAF2F8}
#poiPanel .ph b{font:600 16px/1.2 var(--disp);text-transform:uppercase}
#poiPanel .ph small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
#poiList{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 14px}
#poiList h4{margin:12px 8px 4px;font:700 11px/1 'PT Root UI',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.poi-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;border-radius:14px;padding:7px 9px;transition:.15s}
.poi-row:hover{background:var(--light)}
.poi-row .pe{flex:none;font-size:15px}
.poi-row .pn{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poi-row .pm{flex:none;font-size:11px;color:var(--muted);white-space:nowrap}
.poi-row .pm .q{color:var(--accent);font-weight:700}
#poiPanel .pf{padding:8px 18px 12px;border-top:1.5px solid #EAF2F8;font-size:11.5px;color:var(--muted)}

/* тултип точки */
#tip{position:fixed;z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:8px 13px;font-size:12.5px;pointer-events:none;display:none;max-width:240px;box-shadow:var(--shadow)}
#tip small{display:block;opacity:.8;font-size:11px;margin-top:2px}

/* подсказка управления */
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(34,34,34,.72);color:#fff;border-radius:100px;padding:7px 18px;font-size:12px;z-index:4;white-space:nowrap;pointer-events:none;transition:opacity .6s}
@media(max-width:640px){#hint{display:none}}

/* загрузка/ошибка */
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--light);z-index:8;text-align:center}
#load .box{font:600 22px/1.3 var(--disp);text-transform:uppercase;color:#1E6E9E}
#load .spin{font-size:44px;animation:bump 1.1s ease-in-out infinite;display:block;margin-bottom:10px}
@keyframes bump{50%{transform:translateY(-8px) scale(1.06)}}
#load .err{max-width:420px;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:24px 30px;font:500 15px/1.5 'PT Root UI',sans-serif;color:var(--ink);text-transform:none}
#load .err button{margin-top:12px}

/* финал */
#finish{position:absolute;inset:0;background:rgba(255,255,255,.88);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:9}
#finish[hidden]{display:none}
#finish .card{background:#fff;border-radius:32px;box-shadow:var(--shadow);padding:30px 40px;max-width:430px;text-align:center;margin:16px}
#finish h2{margin:0 0 4px;font:600 30px/1.1 var(--disp);text-transform:uppercase}
#finish .big{font:600 56px/1 var(--disp);color:var(--accent);margin:10px 0 2px}
#finish ul{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
#finish ul b{font-weight:700}
#finish .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* тост */
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:#fff;border-radius:100px;padding:10px 22px;font-size:13.5px;opacity:0;pointer-events:none;transition:.35s;z-index:10;box-shadow:var(--shadow);max-width:82%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

function fmtDateShort(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return '—';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return `${+m[3]}.${+m[2]} · ${WD_SHORT[d.getDay()]}`;
}
function fmtDateFull(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);

const ROUTE_DUR = { zone:90, extreme:40, family:35, kids:25, interactive:45 };
const ROUTE_PEAK = { kids:12.5, zone:13.5, interactive:14, family:14.5, extreme:16 };
const GAP = 15, LUNCH_MIN = 13 * 60;
function buildRoute(ids){
  const picks = ids.map(byId).filter(Boolean);
  if (!picks.length) return [];
  const order = [...picks].sort((a, b) => (ROUTE_PEAK[a.t] || 14) - (ROUTE_PEAK[b.t] || 14) || a.id - b.id);
  const items = [];
  let cursor = clamp(parseHM(visit.time), OPEN_MIN, 20 * 60), lunch = false;
  for (const a of order){
    const dur = ROUTE_DUR[a.t] || 40;
    if (!lunch && cursor < LUNCH_MIN && cursor + dur > LUNCH_MIN){
      items.push({ h:LUNCH_MIN, name:'Обед', dur:60, lunch:true });
      cursor = LUNCH_MIN + 60 + GAP; lunch = true;
    }
    if (cursor + dur > CLOSE_MIN) continue;
    items.push({ h:cursor, name:a.n, dur, type:a.t, id:a.id });
    cursor += dur + GAP;
  }
  return items;
}
function fitAll(a, hs){ return hs.every(h => h >= a.lo && h <= a.hi); }

/* ================= погода (бэкенд → напрямую Open-Meteo) ================= */
const PARK = { lat:55.771505, lon:37.434665 };
const wxEmoji = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c < 50 ? '🌫️' : c < 60 ? '🌦️' : c < 70 ? '🌧️' : c < 80 ? '❄️' : c < 95 ? '🌧️' : '⛈️';
const fmtTemp = t => (t > 0 ? '+' : '') + Math.round(t) + ' °C';
const wxKind = c => c === 0 ? 'clear' : c <= 2 ? 'partly' : c === 3 ? 'cloudy' : c < 50 ? 'fog' :
  (c < 70 || (c >= 80 && c < 83)) ? 'rain' : (c < 87) ? 'snow' : c < 95 ? 'rain' : 'storm';
let weather = null;   // {t, code, precip, wind, approx, kind} | null
async function fetchWeather(date, hour){
  const tryBackend = async () => {
    const r = await fetch(`api/weather?date=${date}&hour=${hour}`);
    if (!r.ok) throw new Error('http_' + r.status);
    const w = await r.json();
    if (!w || typeof w.t !== 'number') throw new Error('bad_payload');
    return w;
  };
  const tryDirect = async () => {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${PARK.lat}&longitude=${PARK.lon}` +
      `&hourly=temperature_2m,precipitation_probability,weathercode,wind_speed_10m` +
      `&start_date=${date}&end_date=${date}&timezone=Europe%2FMoscow`;
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 6000);
    let r; try{ r = await fetch(u, { signal:ctrl.signal }); } finally { clearTimeout(timer); }
    if (!r.ok) throw new Error('http_' + r.status);
    const h = (await r.json()).hourly;
    let i = h.time.findIndex(t => t.endsWith('T' + String(hour).padStart(2, '0') + ':00'));
    if (i < 0) i = h.time.findIndex(t => t.endsWith('T12:00'));
    return { t:h.temperature_2m[i], code:h.weathercode[i], precip:(h.precipitation_probability || [])[i] ?? 0, wind:Math.round(h.wind_speed_10m[i] || 0), approx:false };
  };
  for (const f of [tryBackend, tryDirect]){
    try{
      const w = await f();
      return { ...w, kind:wxKind(w.code) };
    }catch{}
  }
  return null;
}

/* имя аттракциона из дашборда → id каталога */
const nameToId = new Map(CATALOG.map(a => [a.n, a.id]));
function topIdsFromStats(){
  return (stats?.topAttractions || [])
    .map(a => ({ id:nameToId.get(a.name), count:a.count }))
    .filter(x => x.id && POS[x.id]);

/* толпа: размер — из загрузки этого дня недели, состав — из категорий,
   имена — из реальных заявок, интересы — из топа аттракционов */
function buildCrowd(){
  const tops = topIdsFromStats();
  const realNames = [];
  for (const v of (stats?.recentVisits || [])) for (const g of (v.group || [])) if (g.name) realNames.push(String(g.name).slice(0, 16));
  const pool = realNames.length >= 6 ? realNames : NAME_POOL;

  /* масштаб дня: сколько заявок планировали визит на этот день недели (и на эту дату) */
  let factor = 1;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(visit.date);
  if (m && stats?.weekdays?.length){
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    const wd = (d.getDay() + 6) % 7;                       // 0 = понедельник
    const mx = Math.max(1, ...stats.weekdays.map(w => w.count || 0));
    const c = stats.weekdays[wd]?.count || 0;
    factor = 0.55 + 0.9 * (c / mx);
    if ((stats.dates || []).some(([dstr]) => dstr === visit.date)) factor += 0.25;
  }
  if (weather) factor *= { rain:0.65, storm:0.5, snow:0.6, fog:0.85 }[weather.kind] || 1;

  const baseGroups = clamp(Math.round((stats?.visitsCount || 12) * 0.9 * factor), 5, 16);
  const C = stats?.categories || {};
  const catSum = (C.family || 0) + (C.adults || 0) + (C.kids || 0);
  const catW = catSum ? [ (C.family || 0) / catSum, (C.adults || 0) / catSum, (C.kids || 0) / catSum ] : [0.55, 0.25, 0.2];
  const sampleCat = () => { const r = Math.random(); return r < catW[0] ? 'family' : r < catW[0] + catW[1] ? 'adults' : 'kids'; };

  const CAT_COLOR = { family:['#34B4E8','#5BC6EE','#2AA0D0'], adults:['#00B453','#33C276','#00914A'], kids:['#CCB5FB','#B882D0','#DDCBFC'] };
  const mkMember = (cat, name) => {
    const h = cat === 'kid' ? Math.round(rnd(92, 118)) : cat === 'child' ? Math.round(rnd(122, 148)) : Math.round(rnd(155, 190));
    return { name, h, cat, color:pickOf(CAT_COLOR[cat === 'kid' || cat === 'child' ? 'kids' : cat] || CAT_COLOR.adults), kid:h < 130 };
  };
  const groups = [];
  for (let i = 0; i < baseGroups; i++){
    const cat = sampleCat();
    let members = [];
    if (cat === 'family'){
      members = [mkMember('adult', pickOf(pool)), mkMember('adult', pickOf(pool))];
      const nk = Math.random() < 0.6 ? 2 : 1;
      for (let k = 0; k < nk; k++) members.push(mkMember(Math.random() < 0.5 ? 'kid' : 'child', pickOf(pool)));
    } else if (cat === 'adults'){
      const n = 2 + Math.floor(Math.random() * 2);
      for (let k = 0; k < n; k++) members.push(mkMember('adult', pickOf(pool)));
    } else {
      members = [mkMember('adult', pickOf(pool))];
      const n = 2 + Math.floor(Math.random() * 2);
      for (let k = 0; k < n; k++) members.push(mkMember(Math.random() < 0.5 ? 'kid' : 'child', pickOf(pool)));
    }
    /* интересы: тянутся к топу дашборда + пара случайных точек */
    const plan = [];
    const nWanted = 2 + Math.floor(Math.random() * 3);
    const topsShuffled = [...tops].sort(() => Math.random() - 0.5);
    for (const t of topsShuffled){ if (plan.length >= nWanted) break; if (Math.random() < 0.75) plan.push(t.id); }
    while (plan.length < Math.max(1, nWanted)){ const id = pickOf(CATALOG.filter(a => POS[a.id])).id; if (!plan.includes(id)) plan.push(id); }
    groups.push({ members, plan, delay:i * rnd(1.6, 2.6), speed:rnd(52, 82) });
  }
  /* очереди у топ-3 аттракционов */
  const mxCount = Math.max(1, ...tops.map(t => t.count));
  const queues = tops.slice(0, 3).map(t => ({
    id:t.id,
    people:clamp(Math.round(2 + (t.count / mxCount) * 4 * factor + 0.5), 2, 6),
    waitMin:Math.max(2, Math.round((3 + t.count * 2) * ({ rain:0.6, storm:0.5, snow:0.6 }[weather?.kind] || 1))),
  }));
  return { groups, queues };
}

/* ================= группа-«гусеница» (игрок и компании гостей) ================= */
const TRAIL_SPACING = 13; // кадров между членами группы
function makeGroup(o){
  return {
    x:o.x, y:o.y, speed:o.speed || 65, members:o.members, npc:!!o.npc,
    hist:[], target:null, phase:'idle', waitT:o.delay || 0, bubble:0,
    plan:o.plan || [], pi:0, stuck:0, avoidT:0, avoid:null, umbrella:!!o.umbrella,
    dist:0, bob:Math.random() * 6,
  };
}
function groupUpdate(g, dt, input){
  if (g.npc && g.waitT > 0 && g.phase === 'idle'){ g.waitT -= dt; return; }
  let tx = null, ty = null;
  if (!g.npc){
    if (input.dir){ tx = g.x + input.dir.x * 100; ty = g.y + input.dir.y * 100; }
    else if (input.target){ tx = input.target.x; ty = input.target.y; }
  } else {
    if (g.phase === 'idle' && g.waitT <= 0){
      const id = g.pi < g.plan.length ? g.plan[g.pi] : pickOf(CATALOG.filter(a => POS[a.id])).id;
      const p = POS[id];
      g.target = { x:clamp(p[0] + rnd(-26, 26), 24, WORLD.w - 24), y:clamp(p[1] + rnd(-26, 26), 24, WORLD.h - 24) };
      g.phase = 'walk';
    }
    if (g.phase === 'walk' && g.target && dist2(g.x, g.y, g.target.x, g.target.y) < 14 * 14){
      g.phase = 'linger'; g.waitT = rnd(6, 14); g.bubble = 5;
    }
    if (g.phase === 'linger'){
      g.waitT -= dt; g.bubble -= dt;
      if (g.waitT <= 0){ g.pi++; g.phase = 'idle'; }
      g.hist.unshift({ x:g.x, y:g.y }); if (g.hist.length > 240) g.hist.pop();
      return;
    }
    if (g.target){ tx = g.target.x; ty = g.target.y; }
  }
  let moving = false;
  if (tx !== null){
    let dx = tx - g.x, dy = ty - g.y;
    const d = Math.hypot(dx, dy);
    const stopAt = g.npc ? 10 : 3;
    if (d > stopAt){
      if (g.avoidT > 0){ dx = g.avoid.dx; dy = g.avoid.dy; g.avoidT -= dt; }
      const sp = g.speed * (input?.run ? 1.6 : 1);
      const nx = g.x + (dx / d) * sp * dt, ny = g.y + (dy / d) * sp * dt;
      const before = { x:g.x, y:g.y };
      g.x = clamp(nx, 18, WORLD.w - 18); g.y = clamp(ny, 18, WORLD.h - 18);
      collide(g, 7);
      const moved = Math.hypot(g.x - before.x, g.y - before.y);
      g.dist += moved; moving = moved > 0.1;
      /* упёрлись — короткий обход вбок */
      if (moved < sp * dt * 0.25){ g.stuck += dt; } else g.stuck = 0;
      if (g.stuck > 0.7){
        const a = Math.atan2(dy, dx) + (Math.random() < 0.5 ? 1 : -1) * rnd(0.9, 1.6);
        g.avoid = { dx:Math.cos(a), dy:Math.sin(a) }; g.avoidT = rnd(0.5, 1.0); g.stuck = 0;
      }
      g.bob += dt * 10;
    } else if (!g.npc && input.target){ input.target = null; }
  }
  g.moving = moving;
  g.hist.unshift({ x:g.x, y:g.y }); if (g.hist.length > 240) g.hist.pop();
}
function trailPos(g, i){
  const e = g.hist[Math.min(g.hist.length - 1, (i + 1) * TRAIL_SPACING)];
  return e || { x:g.x, y:g.y };
}
/* выталкивание из препятствий (круги и прямоугольники) */
function collide(e, r){
  for (const o of OBSTACLES){
    if (o.type === 'c'){
      const d2 = dist2(e.x, e.y, o.x, o.y), rr = o.r + r;
      if (d2 < rr * rr && d2 > 0.01){
        const d = Math.sqrt(d2); e.x = o.x + (e.x - o.x) / d * rr; e.y = o.y + (e.y - o.y) / d * rr;
      }
    } else {
      const cx = clamp(e.x, o.x, o.x + o.w), cy = clamp(e.y, o.y, o.y + o.h);
      const d2 = dist2(e.x, e.y, cx, cy);
      if (d2 < r * r){
        if (d2 > 0.01){
          const d = Math.sqrt(d2); e.x = cx + (e.x - cx) / d * r; e.y = cy + (e.y - cy) / d * r;
        } else {
          /* внутри — выталкиваем к ближайшей стороне */
          const dl = e.x - o.x, dr = o.x + o.w - e.x, dt2 = e.y - o.y, db = o.y + o.h - e.y;
          const mn = Math.min(dl, dr, dt2, db);
          if (mn === dl) e.x = o.x - r; else if (mn === dr) e.x = o.x + o.w + r;
          else if (mn === dt2) e.y = o.y - r; else e.y = o.y + o.h + r;
        }
      }
    }
  }
}
function pointBlocked(x, y, r){
  for (const o of OBSTACLES){
    if (o.type === 'c'){ if (dist2(x, y, o.x, o.y) < (o.r + r) * (o.r + r)) return true; }
    else { const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h); if (dist2(x, y, cx, cy) < r * r) return true; }
  }
  return false;
}

let quests = [];         // {name,by,poi:{x,y},kind,id,reachR,state,doneAt,onTime}
let gameMin = 0, clockSpeed = 1, dayEnded = false, score = 0, visitedOnTime = 0;
function buildQuests(){
  let ids = visit.picks;
  if (!ids.length){
    /* пустой топ — собираем демо-маршрут из топа дашборда (по росту группы) */
    const hs = visit.group.map(g => g.h);
    const fits = topIdsFromStats().map(t => byId(t.id)).filter(a => fitAll(a, hs)).map(a => a.id);
    ids = (fits.length >= 3 ? fits : [30, 58, 46, 19]).slice(0, 5);
  }
  const items = buildRoute(ids);
  let last = { x:ENTRANCE.x, y:ENTRANCE.y };
  quests = items.map(it => {
    let poi, kind, id = null;
    if (it.lunch){
      kind = 'lunch';
      let best = null, bd = 1e18;
      for (const c of CAFES){
        const d = dist2(last.x, last.y, c.x, c.y);
        if (d < bd){ bd = d; best = c; }
      }
      poi = { x:best.x, y:best.y, label:'🍝 ' + best.n };
    } else {
      kind = 'attr'; id = it.id;
      poi = { x:POS[id][0], y:POS[id][1], label:(TYPE_EMOJI[it.type] || '🎡') + ' ' + it.name };
    }
    last = poi;
    return { name:it.name, by:it.h, poi, kind, id, reachR:kind === 'lunch' ? 42 : reachRof(id), state:'pending', rideT:0 };
  });
  gameMin = parseHM(visit.time);
}

const PLAYER_COLORS = ['#FF2400', '#00B453', '#CCB5FB', '#34B4E8', '#F57C00', '#26A69A', '#EC407A', '#8D6E63'];

    members:visit.group.map((g, i) => ({ name:g.name, h:g.h, kid:g.h < 130, color:PLAYER_COLORS[i % PLAYER_COLORS.length] })) });
  npcs = crowd.groups.map(g => makeGroup({

    members:g.members, plan:g.plan, npc:true, umbrella:weather && (weather.kind === 'rain' || weather.kind === 'storm') && Math.random() < 0.55,
  }));
  idlers = [];
  for (const q of crowd.queues){
    const p = POS[q.id];
    const a = rnd(0, Math.PI * 2), ux = Math.cos(a), uy = Math.sin(a);
    for (let i = 0; i < q.people; i++){
      const px = clamp(p[0] + ux * (26 + i * 13) + rnd(-4, 4), 20, WORLD.w - 20);
      const py = clamp(p[1] + uy * (26 + i * 13) + rnd(-4, 4), 20, WORLD.h - 20);
      idlers.push({ x:px, y:py, baseX:px, baseY:py, color:pickOf(['#34B4E8', '#00B453', '#CCB5FB', '#F57C00']), phase:rnd(0, 6), kid:Math.random() < 0.3 });
    }
  }
  /* «сказки» — бонусные искорки у точек парка */
  sparkles = [];
  const allPois = CATALOG.filter(a => POS[a.id]);
  let guard = 0;
  while (sparkles.length < 18 && guard++ < 300){
    const a = pickOf(allPois), p = POS[a.id];
    const x = p[0] + rnd(-55, 55), y = p[1] + rnd(-55, 55);
    if (x < 24 || x > WORLD.w - 24 || y < 24 || y > WORLD.h - 24 || pointBlocked(x, y, 12)) continue;
    if (sparkles.some(s => dist2(s.x, s.y, x, y) < 70 * 70)) continue;
    sparkles.push({ x, y, taken:false, phase:rnd(0, 6) });
  }
}

let wxParts = [], wxFlash = 0, wxFlashIn = 5, fogBlobs = [];
function buildWeatherFx(){
  wxParts = []; fogBlobs = [];
  const kind = weather?.kind || 'clear';
  const n = kind === 'storm' ? 150 : kind === 'rain' ? 95 : kind === 'snow' ? 110 : 0;
  for (let i = 0; i < n; i++){
    wxParts.push({ x:Math.random(), y:Math.random(), r:rnd(1.2, 2.6), ph:rnd(0, 6), sp:rnd(0.7, 1.3) });
  }
  for (let i = 0; i < 4; i++) fogBlobs.push({ x:Math.random(), y:rnd(0.1, 0.9), r:rnd(0.25, 0.5), vx:rnd(0.008, 0.02) * (Math.random() < 0.5 ? -1 : 1) });
}
function drawWeather(ctx, W, H, t, dt){
  const kind = weather?.kind || 'clear';
  if (kind === 'rain' || kind === 'storm'){
    const wind = (weather?.wind ?? 3);
    ctx.strokeStyle = kind === 'storm' ? 'rgba(178,205,232,0.62)' : 'rgba(190,214,238,0.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    const L = kind === 'storm' ? 20 : 15;
    for (const p of wxParts){
      const x = p.x * W, y = p.y * H;
      ctx.moveTo(x, y); ctx.lineTo(x + wind * 1.6, y + L * p.sp);
    }
    ctx.stroke();
    for (const p of wxParts){
      p.y += (0.9 + wind * 0.02) * p.sp * dt; p.x += wind * 0.004 * dt;
      if (p.y > 1.02){ p.y = -0.02; p.x = Math.random(); }
      if (p.x > 1.02) p.x = -0.02;
    }
    if (kind === 'storm'){
      wxFlashIn -= dt;
      if (wxFlashIn <= 0){ wxFlash = 0.4; wxFlashIn = rnd(4, 9); }
      if (wxFlash > 0){ ctx.fillStyle = `rgba(255,255,255,${wxFlash * 0.55})`; ctx.fillRect(0, 0, W, H); wxFlash = Math.max(0, wxFlash - dt * 1.4); }
    }
  } else if (kind === 'snow'){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const p of wxParts){
      const x = (p.x + Math.sin(t * 0.7 + p.ph) * 0.012) * W, y = p.y * H;
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(p.ph + t);
      ctx.beginPath(); ctx.arc(x, y, p.r * 1.4, 0, 7); ctx.fill();
      p.y += 0.045 * p.sp * dt; if (p.y > 1.02){ p.y = -0.02; p.x = Math.random(); }
    }
    ctx.globalAlpha = 1;
  }
  if (kind === 'fog' || kind === 'cloudy' || kind === 'rain' || kind === 'storm' || kind === 'snow'){
    ctx.fillStyle = kind === 'fog' ? 'rgba(214,224,232,0.28)' : 'rgba(150,165,180,0.12)';
    ctx.fillRect(0, 0, W, H);
  }
  if (kind === 'fog'){
    for (const b of fogBlobs){
      const g = ctx.createRadialGradient(b.x * W, b.y * H, 0, b.x * W, b.y * H, b.r * Math.max(W, H));
      g.addColorStop(0, 'rgba(228,236,242,0.4)'); g.addColorStop(1, 'rgba(228,236,242,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      b.x += b.vx * dt; if (b.x > 1.2) b.x = -0.2; if (b.x < -0.2) b.x = 1.2;
    }
  }
  if (kind === 'clear' || kind === 'partly'){
    const g = ctx.createLinearGradient(0, 0, W * 0.7, H);
    g.addColorStop(0, 'rgba(255,214,110,0.16)'); g.addColorStop(0.5, 'rgba(255,214,110,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (kind === 'partly' || kind === 'cloudy'){
    /* тени облаков */
    ctx.fillStyle = 'rgba(40,60,80,0.05)';
    for (let i = 0; i < 4; i++){
      const cx = ((t * 8 + i * 430) % (W + 500)) - 250, cy = H * (0.15 + 0.24 * i);
      ctx.beginPath(); ctx.ellipse(cx, cy, 170, 60, 0, 0, 7); ctx.fill();
    }
  }
}

function camClamp(){
  const vw = W / cam.z, vh = H / cam.z;
  cam.x = vw >= WORLD.w ? WORLD.w / 2 : clamp(cam.x, vw / 2, WORLD.w - vw / 2);
  cam.y = vh >= WORLD.h ? WORLD.h / 2 : clamp(cam.y, vh / 2, WORLD.h - vh / 2);

function hoverCheck(e){
  const r = cv.getBoundingClientRect();
  const w = screenToWorld(e.clientX - r.left, e.clientY - r.top);
  let best = null, bd = 1e18;
  for (const a of CATALOG){ if (!POS[a.id]) continue; const d = dist2(w.x, w.y, POS[a.id][0], POS[a.id][1]); if (d < bd){ bd = d; best = a; } }
  const tip = $('#tip');
  const rr = reachRof(best?.id);
  if (best && bd < (rr + 10) * (rr + 10)){
    const q = queueOf(best.id);

      `<small>рост ${best.lo ? 'от ' + best.lo : 'любой'}${best.hi < 250 ? '–' + best.hi : ''} см · от ${best.p} ₽${q ? ' · очередь ⏱ ~' + q.waitMin + ' мин' : ''}</small>`;

async function loadMap(){
  const r = await fetch('map.svg');
  if (!r.ok) throw new Error('Карта недоступна (HTTP ' + r.status + ')');
  const text = await r.text();
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svg = doc.querySelector('svg');
  if (!svg || svg.querySelector('parsererror')) throw new Error('Не удалось разобрать map.svg');
  /* страховка: если подсунули полную схему с легендой — срезаем её же кодом */
  for (const g of [...svg.children].filter(el => el.tagName === 'g')){
    if (g.querySelector('rect[x="1492"]')) g.remove();
  }
  for (const t of [...svg.querySelectorAll('text')]) if (['ВЫ', 'ЗДЕСЬ'].includes(t.textContent.trim())) t.remove();
  svg.querySelector('use[href="#pin"][transform*="940,878"]')?.remove();
  svg.setAttribute('viewBox', `0 0 ${WORLD.w} ${WORLD.h}`);
  svgWrap.appendChild(svg);
  /* деревья как препятствия */
  for (const u of svg.querySelectorAll('use')){
    const href = u.getAttribute('href') || u.getAttribute('xlink:href');
    if (href !== '#tr') continue;
    const m = /translate\(\s*([\d.]+)[ ,]+([\d.]+)/.exec(u.getAttribute('transform') || '');
    if (m) OBSTACLES.push({ type:'c', x:+m[1], y:+m[2], r:12 });
  }
}

/* ================= рисование ================= */
function rr(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function drawPerson(c, x, y, color, kid, bob, umbrellaColor){
  const s = kid ? 0.78 : 1;
  c.fillStyle = 'rgba(30,40,30,0.22)';
  c.beginPath(); c.ellipse(x, y + 9 * s, 7 * s, 3 * s, 0, 0, 7); c.fill();
  const by = y - Math.abs(Math.sin(bob)) * 1.6;
  c.fillStyle = color;
  rr(c, x - 4.5 * s, by - 3 * s, 9 * s, 13 * s, 4 * s); c.fill();
  c.fillStyle = '#FFD9B3';
  c.beginPath(); c.arc(x, by - 7 * s, 4.6 * s, 0, 7); c.fill();
  c.fillStyle = 'rgba(60,40,25,0.85)';
  c.beginPath(); c.arc(x, by - 8.6 * s, 4.6 * s, Math.PI, 0); c.fill();
  if (umbrellaColor){
    c.strokeStyle = '#555'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(x, by - 9 * s); c.lineTo(x, by - 20 * s); c.stroke();
    c.fillStyle = umbrellaColor;
    c.beginPath(); c.arc(x, by - 19 * s, 11 * s, Math.PI, 0); c.fill();
  }
}
function drawBubble(c, x, y, text){
  c.font = '600 11px "PT Root UI", sans-serif';
  const w = c.measureText(text).width + 16;
  const bx = clamp(x - w / 2, 4, WORLD.w - w - 4), by = y - 34;
  c.fillStyle = 'rgba(255,255,255,0.96)';
  rr(c, bx, by - 12, w, 21, 10); c.fill();
  c.beginPath(); c.moveTo(x - 4, by + 9); c.lineTo(x + 4, by + 9); c.lineTo(x, by + 15); c.fill();
  c.fillStyle = '#222'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, bx + w / 2, by - 1);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
}
function drawGroup(c, g, showNames){
  for (let i = g.members.length - 1; i >= 0; i--){
    const m = g.members[i], p = i === 0 ? g : trailPos(g, i);
    drawPerson(c, p.x, p.y, m.color, m.kid, g.moving || g.npc ? g.bob + i : 0, g.umbrella && i === 0 ? '#E53935' : null);
    if (showNames && i === 0){
      c.font = '700 11px "PT Root UI", sans-serif';
      c.textAlign = 'center';
      c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.9)'; c.strokeText(m.name, p.x, p.y + 21);
      c.fillStyle = '#222'; c.fillText(m.name, p.x, p.y + 21);
      c.textAlign = 'left';
    }
  }
}
function draw(c, t, dt){
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  c.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, dpr * (W / 2 - cam.x * cam.z), dpr * (H / 2 - cam.y * cam.z));

  /* цели квестов: пульсирующие кольца + подпись */
  for (const q of quests){
    if (q.state !== 'pending') continue;
    const pulse = 1 + 0.08 * Math.sin(t * 4);
    c.strokeStyle = 'rgba(211,45,107,0.75)'; c.lineWidth = 3;
    c.beginPath(); c.arc(q.poi.x, q.poi.y, q.reachR * pulse, 0, 7); c.stroke();
    c.strokeStyle = 'rgba(211,45,107,0.28)'; c.lineWidth = 8;
    c.beginPath(); c.arc(q.poi.x, q.poi.y, q.reachR * pulse + 7, 0, 7); c.stroke();
    c.font = '700 13px "PT Root UI", sans-serif'; c.textAlign = 'center';
    c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,0.95)';
    const label = q.poi.label + ' · до ' + fmtHM(q.by);
    c.strokeText(label, q.poi.x, q.poi.y - q.reachR - 12);
    c.fillStyle = '#D32D6B'; c.fillText(label, q.poi.x, q.poi.y - q.reachR - 12);
    c.textAlign = 'left';
  }
  /* «сказки»-искорки */
  for (const s of sparkles){
    if (s.taken) continue;
    const a = 0.55 + 0.45 * Math.sin(t * 5 + s.phase);
    c.fillStyle = `rgba(255,240,150,${a})`;
    c.strokeStyle = `rgba(255,200,40,${a})`; c.lineWidth = 1.5;
    const r = 6 + Math.sin(t * 5 + s.phase) * 1.5;
    c.beginPath();
    for (let i = 0; i < 8; i++){
      const rad = i % 2 ? r * 0.42 : r, an = i * Math.PI / 4 + s.phase;
      const px = s.x + Math.cos(an) * rad, py = s.y + Math.sin(an) * rad;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath(); c.fill(); c.stroke();
  }
  /* цель клика */
  const input = playerInput();
  if (player && player.target){
    c.strokeStyle = 'rgba(52,180,232,0.9)'; c.lineWidth = 2;
    c.beginPath(); c.arc(player.target.x, player.target.y, 9, 0, 7); c.stroke();
    c.beginPath(); c.moveTo(player.target.x, player.target.y - 16); c.lineTo(player.target.x + 5, player.target.y - 7); c.lineTo(player.target.x - 5, player.target.y - 7); c.closePath();
    c.fillStyle = '#34B4E8'; c.fill();
  }
  /* очереди у топ-точек */
  for (const q of queues){
    const p = POS[q.id];
    c.font = '700 11px "PT Root UI", sans-serif'; c.textAlign = 'center';
    const label = `⏱ ~${q.waitMin} мин`;
    const wpx = c.measureText(label).width + 14;
    c.fillStyle = 'rgba(255,255,255,0.92)';
    rr(c, p[0] - wpx / 2, p[1] + 18, wpx, 18, 9); c.fill();
    c.fillStyle = '#C62828'; c.fillText(label, p[0], p[1] + 31);
    c.textAlign = 'left';
  }
  /* гости */
  for (const il of idlers) drawPerson(c, il.x + Math.sin(t * 1.6 + il.phase) * 1.2, il.y, il.color, il.kid, t * 2 + il.phase, (weather?.kind === 'rain' || weather?.kind === 'storm') && il.phase > 3 ? '#455A64' : null);
  for (const g of npcs){
    if (g.phase === 'idle' && g.waitT > 0 && !g.hist.length) continue; // ещё не зашли
    drawGroup(c, g, false);
  }
  /* пузыри интересов (ближайшие 6) */
  const bubbling = npcs.filter(g => g.bubble > 0 && g.pi > 0)
    .sort((a, b) => dist2(a.x, a.y, player.x, player.y) - dist2(b.x, b.y, player.x, player.y)).slice(0, 6);
  for (const g of bubbling){
    const id = g.plan[Math.min(g.pi - 1, g.plan.length - 1)];
    const a = id && byId(id);
    if (a) drawBubble(c, g.x, g.y - (g.members[0].kid ? 30 : 36), (TYPE_EMOJI[a.t] || '🎡') + ' ' + (a.n.length > 17 ? a.n.slice(0, 16) + '…' : a.n));
  }
  /* игрок */
  if (player){
    drawGroup(c, player, true);
    /* прогресс «катания» */
    const q = quests.find(q => q.state === 'pending' && dist2(player.x, player.y, q.poi.x, q.poi.y) < q.reachR * q.reachR);
    if (q && q.rideT > 0.15){
      c.strokeStyle = '#D32D6B'; c.lineWidth = 5;
      c.beginPath(); c.arc(player.x, player.y, 16, -Math.PI / 2, -Math.PI / 2 + (q.rideT / 2.2) * Math.PI * 2); c.stroke();
      c.font = '700 11px "PT Root UI", sans-serif'; c.textAlign = 'center';
      c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.9)';
      c.strokeText('катаемся…', player.x, player.y - 24);
      c.fillStyle = '#D32D6B'; c.fillText('катаемся…', player.x, player.y - 24);
      c.textAlign = 'left';
    }
  }
  /* эффекты: искры и всплывающие очки */
  for (const b of bursts){
    c.globalAlpha = Math.max(0, b.life * 1.6);
    c.fillStyle = b.color;
    c.beginPath(); c.arc(b.x, b.y, 2.6, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  c.font = '700 13px "PT Root UI", sans-serif'; c.textAlign = 'center';
  for (const f of floaters){
    c.globalAlpha = Math.max(0, f.life);
    c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.9)';
    c.strokeText(f.text, f.x, f.y); c.fillStyle = f.color; c.fillText(f.text, f.x, f.y);
  }
  c.globalAlpha = 1; c.textAlign = 'left';

  /* ---------- экранное пространство ---------- */
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawWeather(c, W, H, t, dt);
  /* указатель на текущую цель, если она за экраном */
  const cur = currentQuest();
  if (cur && player){
    const sx = (cur.poi.x - cam.x) * cam.z + W / 2, sy = (cur.poi.y - cam.y) * cam.z + H / 2;
    if (sx < 0 || sx > W || sy < 0 || sy > H){
      const cx = clamp(sx, 36, W - 36), cy = clamp(sy, 90, H - 60);
      const an = Math.atan2(sy - cy, sx - cx);
      c.save(); c.translate(cx, cy); c.rotate(an);
      c.fillStyle = '#D32D6B';
      c.beginPath(); c.moveTo(14, 0); c.lineTo(-8, -9); c.lineTo(-8, 9); c.closePath(); c.fill();
      c.restore();
      c.font = '700 11px "PT Root UI", sans-serif'; c.textAlign = 'center';
      c.fillStyle = '#D32D6B';
      const meters = Math.round(Math.hypot(cur.poi.x - player.x, cur.poi.y - player.y));
      c.fillText(meters + ' м', cx, cy + 24);
      c.textAlign = 'left';
    }
  }
}
function playerInput(){
  const kx = (keys.has('d') || keys.has('в') || keys.has('arrowright')) - (keys.has('a') || keys.has('ф') || keys.has('arrowleft'));
  const ky = (keys.has('s') || keys.has('ы') || keys.has('arrowdown')) - (keys.has('w') || keys.has('ц') || keys.has('arrowup'));
  let dir = null;
  if (kx || ky){ const l = Math.hypot(kx, ky); dir = { x:kx / l, y:ky / l }; player.target = null; }
  return { dir, run:keys.has('shift') };
}
function currentQuest(){
  const pending = quests.filter(q => q.state === 'pending');
  return pending.length ? pending.reduce((a, b) => (a.by <= b.by ? a : b)) : null;
}

/* ================= логика визита ================= */
function updateQuests(dt){
  if (dayEnded) return;
  gameMin = Math.min(CLOSE_MIN, gameMin + dt * clockSpeed);
  const cur = currentQuest();
  for (const q of quests){
    if (q.state !== 'pending') continue;
    const near = dist2(player.x, player.y, q.poi.x, q.poi.y) < q.reachR * q.reachR;
    q.rideT = near ? q.rideT + dt : 0;
    if (q.rideT >= 2.2){
      q.state = 'done'; q.doneAt = gameMin;
      q.onTime = gameMin <= q.by + 15;
      const pts = q.kind === 'lunch' ? (q.onTime ? 40 : 25) : (q.onTime ? 100 : 60);
      score += pts; if (q.onTime) visitedOnTime++;
      burst(q.poi.x, q.poi.y, q.kind === 'lunch' ? '#F57C00' : '#D32D6B');
      floatText(q.poi.x, q.poi.y - 20, '+' + pts + (q.onTime ? ' · вовремя!' : ' · с опозданием'));
      toast((q.kind === 'lunch' ? '🍝 Поели в «' : '✅ ') + (q.kind === 'lunch' ? q.poi.label.replace('🍝 ', '') + '»' : q.name) + (q.onTime ? ' — по плану!' : ' — не успели к ' + fmtHM(q.by)));
      renderQuestCard();
      if (quests.every(x => x.state === 'done')){ score += 200; finish(true); }
    }
  }
  if (gameMin >= CLOSE_MIN) finish(false);
}
let questCardTimer = null;
function renderQuestCard(){
  const card = $('#qcard');
  const cur = currentQuest();
  const done = quests.filter(q => q.state === 'done').length;
  if (!cur){
    card.hidden = true;
    return;
  }
  const late = gameMin > cur.by + 15;
  const next = quests.filter(q => q.state === 'pending' && q !== cur).sort((a, b) => a.by - b.by)[0];
  card.innerHTML = `
    <h3>${cur.kind === 'lunch' ? '🍝 Обед' : (TYPE_EMOJI[byId(cur.id)?.t] || '🎡') + ' ' + esc(cur.name)}</h3>
    <div class="sub">по плану до <b>${fmtHM(cur.by)}</b>${late ? ' · <b>опаздываете</b>' : ' · успеваете'}${next ? `<br>дальше: ${esc(next.name)} в ${fmtHM(next.by)}` : ''}</div>
    <button class="btn primary small" type="button" id="qGo">К точке →</button>
    <div class="sub" style="margin-top:7px">пройдено: <b>${done}</b> из ${quests.length}</div>`;
  card.hidden = false;
  card.classList.toggle('done', done === quests.length - 1 && cur);
  $('#qGo').onclick = () => { player.target = { x:cur.poi.x, y:cur.poi.y }; follow = true; };
}
function finish(allDone){
  if (dayEnded) return;
  dayEnded = true;
  const done = quests.filter(q => q.state === 'done').length;
  const meters = Math.round(player.dist);
  $('#finish').innerHTML = `
    <div class="card">
      <h2>${allDone ? 'Маршрут выполнен!' : 'Парк закрывается'}</h2>
      <div style="color:var(--muted);font-size:13.5px">${esc(fmtDateFull(visit.date))} · приход в ${esc(visit.time)}${visit.demo ? ' · демо-визит' : ''}</div>
      <div class="big">${score}<span style="font-size:22px"> ⭐</span></div>
      <ul>
        <li>🎯 Точек пройдено: <b>${done} из ${quests.length}</b> (вовремя — <b>${visitedOnTime}</b>)</li>
        <li>🚶 Пройдено по парку: <b>~${meters} м</b></li>
        <li>👥 Гостей в парке: <b>${npcs.reduce((s, g) => s + g.members.length, 0) + idlers.length}</b> ${stats && !statsDemo ? `· по дашборду (${stats.visitsCount} ${plural(stats.visitsCount, 'заявка', 'заявки', 'заявок')})` : '· демо-данные'}</li>
        ${weather ? `<li>${wxEmoji(weather.code)} Погода: <b>${fmtTemp(weather.t)}</b>, ${weather.approx ? 'ориентир на 10 дней' : 'прогноз на час прихода'}</li>` : ''}
      </ul>
      <div class="row">
        <button class="btn primary" type="button" onclick="location.reload()">↻ Ещё раз</button>
        <button class="btn blue" type="button" id="strollBtn">🚶 Гулять дальше</button>
        <a class="btn blue" href="./">📅 К планировщику</a>
      </div>
    </div>`;
  $('#strollBtn').onclick = () => { $('#finish').hidden = true; };
  $('#finish').hidden = false;
}

/* ================= главный цикл ================= */
let lastT = 0;
function frame(now){
  const t = now / 1000;
  const dt = Math.min(0.05, lastT ? t - lastT : 0.016);
  lastT = t;
  const input = playerInput();
  groupUpdate(player, dt, input);
  for (const g of npcs) groupUpdate(g, dt, null);
  /* «сказки» */
  for (const s of sparkles){
    if (!s.taken && dist2(player.x, player.y, s.x, s.y) < 18 * 18){
      s.taken = true; score += 10;
      burst(s.x, s.y, '#FFC400', 8); floatText(s.x, s.y - 10, '+10 ✨', '#B8860B');
    }
  }
  for (const b of bursts){ b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 160 * dt; b.life -= dt; }
  bursts = bursts.filter(b => b.life > 0);
  for (const f of floaters){ f.y -= 24 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
  updateQuests(dt);
  /* камера */
  if (follow){ cam.x += (player.x - cam.x) * Math.min(1, dt * 5); cam.y += (player.y - cam.y) * Math.min(1, dt * 5); }
  camClamp();
  /* отображение */
  svgWrap.style.transform = `translate(${W / 2 - cam.x * cam.z}px, ${H / 2 - cam.y * cam.z}px) scale(${cam.z})`;
  draw(ctx, t, dt);
  updateHud();
  if (questCardTimer !== currentQuest()){ questCardTimer = currentQuest(); if (questCardTimer) renderQuestCard(); }
  requestAnimationFrame(frame);
}

/* ================= запуск ================= */
(async function init(){
  resize();
  try{
    $('#loadText').textContent = 'Открываем парк…';
    await loadMap();
  }catch(e){
    $('#load').innerHTML = `<div class="box"><div class="err"><b>Не удалось открыть карту.</b><br>${esc(e.message)}<br><button class="btn blue small" type="button" onclick="location.reload()">↻ Повторить</button></div></div>`;
    return;
  }
  $('#loadText').textContent = 'Собираем гостей из дашборда…';
  stats = await fetchStats();
  statsDemo = !stats;
  const crowd = buildCrowd();
  queues = crowd.queues;
  buildQuests();
  spawnEntities(crowd);
  buildPoiPanel();
  /* статус данных */
  const st = $('#dataStatus');
  if (stats && !statsDemo){ st.querySelector('span').textContent = `дашборд · ${stats.visitsCount} ${plural(stats.visitsCount, 'заявка', 'заявки', 'заявок')}`; }
  else { st.classList.add('off'); st.querySelector('span').textContent = 'демо-данные'; }
  $('#load').style.display = 'none';
  renderQuestCard();
  resize();
  cam.z = cam.zFollow = clamp(H / 620, zFit(), 2.2);
  camClamp();
  requestAnimationFrame(frame);
  /* вступление */
  setTimeout(() => toast(`Добро пожаловать! Приход в ${visit.time} · ${visit.group.length} ${plural(visit.group.length, 'гость', 'гостя', 'гостей')} · точек в маршруте: ${quests.filter(q => q.kind === 'attr').length}`), 400);
  if (visit.demo) setTimeout(() => toast('Это демо-визит — спланируйте свой на странице Баюна 📅', 3600), 7000);

  /* погода догоняет, но не задерживает открытие парка: её таймауты (до 12 с на
     двух путях) не должны держать гостя на экране загрузки */
  fetchWeather(visit.date, parseInt(visit.time, 10) || 12).then(w => {
    if (!w) return;
    weather = w;
    svgWrap.style.filter = WX_FILTER[w.kind] || '';
    buildWeatherFx();
    if (w.kind === 'rain' || w.kind === 'storm'){
      for (const g of npcs) g.umbrella = Math.random() < 0.55;
      setTimeout(() => toast('🌧 Дождь! Баюн советует крытые точки — интерактив и кафе'), 2500);
    }
    if (w.kind === 'snow') setTimeout(() => toast('❄️ Снег! Одевайтесь теплее — и на Колесо Обозрения, пока обзор хороший'), 2500);
  });
})();
</script>
